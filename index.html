<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home - OBÍRÍ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    .soldout-label {
      color: #fff;
      background: #d91e1e;
      border-radius: 0.35em;
      padding: 0.07em 0.5em;
      font-weight: bold;
      margin-left: 0.6em;
      font-size: 0.97em;
      vertical-align: middle;
      display: inline-block;
    }
    .food-card.soldout { opacity: 0.48; }
  </style>
</head>
<body>
  <!-- Header (logo only; "RESTAURANT • LOUNGE" tag is via CSS) -->
  <header class="animate__animated animate__fadeInDown">
    <img src="images/obiri.png" alt="OBÍRÍ Restaurant & Lounge Logo" class="logo" />
  </header>

  <main>
    <!-- Menu banner -->
    <div class="menu-banner">
      <h2>MENU</h2>
    </div>

    <!-- OBÍRÍ SPECIAL (home) -->
    <section class="section active" aria-labelledby="obiri-special-title">
      <h3 id="obiri-special-title" class="hero-title" style="text-align:center; margin:0 0 1rem;">OBÍRÍ SPECIAL</h3>

      <div class="food-grid">
        <!-- Fisherman Soup — Head (keep one soup) -->
        <div class="food-card" id="card-fisherman-soup-red-snapper-head" tabindex="0">
          <img src="images/obiri-fisherman-soup-head.jpg" alt="Fisherman Soup with Red Snapper Head" />
          <div class="food-info">
            <h4>Fisherman Soup<br><small>(Red Snapper Head, Ngolo, Periwinkle, shrimps, crab, tiger prawns)</small></h4>
            <p id="price-fisherman-soup-red-snapper-head"></p>
          </div>
        </div>

        <!-- Full Chicken Pepper Soup -->
        <div class="food-card" id="card-full-chicken-pepper-soup" tabindex="0">
          <img src="images/obiri-full-chicken-peppersoup.jpg" alt="Full Chicken Pepper Soup" />
          <div class="food-info">
            <h4>Full Chicken Pepper Soup</h4>
            <p id="price-full-chicken-pepper-soup"></p>
          </div>
        </div>

        <!-- Full Chicken Vegetable Sauce -->
        <div class="food-card" id="card-full-chicken-vegetable-sauce" tabindex="0">
          <img src="images/obiri-full-chicken-vegetable-sauce.jpg" alt="Full Chicken Vegetable Sauce" />
          <div class="food-info">
            <h4>Full Chicken Vegetable Sauce</h4>
            <p id="price-full-chicken-vegetable-sauce"></p>
          </div>
        </div>

        <!-- Palm Wine -->
        <div class="food-card" id="card-palm-wine" tabindex="0">
          <img src="images/obiri-palm-wine.jpg" alt="Palm Wine" />
          <div class="food-info">
            <h4>Palm Wine</h4>
            <p id="price-palm-wine"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation (local file links) -->
  <nav class="bottom-nav" aria-label="Primary">
    <a href="./index.html" class="active">Home</a>
    <a href="./food.html">Food</a>
    <a href="./drinks.html">Drinks</a>
    <a href="./contact.html">Contact</a>
  </nav>

  <!-- Interactive hover script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.food-card');
      cards.forEach(card => {
        card.addEventListener('mousemove', e => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
          card.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
        });
        card.addEventListener('mouseleave', () => {
          card.style.removeProperty('--mouse-x');
          card.style.removeProperty('--mouse-y');
        });
        // keyboard focus visual support
        card.addEventListener('focus', () => card.classList.add('focus'));
        card.addEventListener('blur',  () => card.classList.remove('focus'));
      });
    });
  </script>

  <!-- Live price sync from the admin backend (Google Sheet) -->
  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzglCNUwMTg89aylX0vfv5_w9N1x2Ay1JKtNCq2AiP64vJ8ZuJjzaL9oHipM_-yJmxsww/exec';
    const TOKEN = 'Forgive1988@';
    function formatNaira(amount) {
      if(!amount || isNaN(amount)) return '₦0';
      return '₦' + Number(amount).toLocaleString();
    }
    function getIdFromName(name) {
      return ('price-' + name)
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]/gi,'-')
        .replace(/-+/g,'-')
        .toLowerCase().replace(/-$/, '');
    }
    function getCardIdFromName(name) {
      return ('card-' + name)
        .normalize("NFD").replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]/gi,'-')
        .replace(/-+/g,'-')
        .toLowerCase().replace(/-$/, '');
    }
    function injectPrices() {
      fetch(`${ENDPOINT}?token=${TOKEN}`)
        .then(res => res.json())
        .then(result => {
          if(result.ok) {
            result.rows.forEach(item => {
              if(item.name) {
                let priceId = getIdFromName(item.name);
                let cardId = getCardIdFromName(item.name);
                let priceElem = document.getElementById(priceId);
                let cardElem = document.getElementById(cardId);
                if(priceElem && cardElem) {
                  priceElem.innerHTML = '';
                  cardElem.classList.remove('soldout');
                  if(item.available === true) {
                    priceElem.textContent = formatNaira(item.price);
                  } else {
                    priceElem.innerHTML = `${formatNaira(item.price)} <span class="soldout-label">Sold Out</span>`;
                    cardElem.classList.add('soldout');
                  }
                }
              }
            });
          }
        });
    }
    document.addEventListener('DOMContentLoaded', injectPrices);
  </script>
</body>
</html>

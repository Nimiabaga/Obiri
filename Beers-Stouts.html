<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beers / Stouts — OBÍRÍ</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    .menu-toggle{
      display:flex; justify-content:center; gap:.6rem; flex-wrap:wrap;
      margin:1rem auto 1.2rem; max-width:1100px; padding:0 .6rem;
    }
    .menu-toggle a{
      padding:.55rem 1rem; border-radius:8px; font-weight:800; text-decoration:none;
      background:#0f0f0f; border:1px solid var(--gold-deep); color:var(--gold-solid);
      transition:box-shadow .2s ease, transform .08s ease;
      display:flex; flex-direction:column; align-items:center; gap:3px; min-width:140px; text-align:center;
    }
    .menu-toggle a:hover{ box-shadow:0 0 10px rgba(232,193,49,.22); }
    .menu-toggle a:active{ transform:scale(.98); box-shadow:inset 0 -2px 0 var(--gold-mid),0 0 10px rgba(232,193,49,.45); }
    .menu-toggle .label-main{ display:block; font-size:0.95rem; line-height:1; }
    .price-panel{
      max-width:560px; margin:0 auto 5rem; padding:0 16px;
    }
    .price-panel img{
      width:100%; height:240px; object-fit:cover; display:block;
      border-radius:12px 12px 0 0;
    }
    .price-list{
      list-style:none; margin:0; padding:.4rem 1.1rem 1rem;
      background:#1a1a1a; border-radius:0 0 12px 12px;
    }
    .price-list li{
      display:flex; align-items:baseline; gap:.5rem;
      padding:.75rem 0; border-bottom:1px solid var(--border);
      font-size:1rem; color:var(--text);
    }
    .price-list li:last-child{ border-bottom:0; }
    .price-list .name{ font-weight:700; }
    .price-list .dots{ flex:1; border-bottom:1px dotted rgba(255,255,255,.25); transform:translateY(-4px); }
    .price-list .price{ font-weight:800; white-space:nowrap; color:var(--gold-solid); }
    .price-list li.soldout{ opacity:.48; }
    .soldout-label {
      color: #fff;
      background: #d91e1e;
      border-radius: 0.35em;
      padding: 0.07em 0.5em;
      font-weight: bold;
      margin-left: 0.6em;
      font-size: 0.97em;
      vertical-align: middle;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="animate__animated animate__fadeInDown">
    <img src="images/obiri.png" alt="OBÍRÍ Restaurant & Lounge Logo" class="logo" />
  </header>
  <div class="menu-banner"><h2>DRINKS MENU</h2></div>
  <nav class="menu-toggle" aria-label="Back to Drinks">
    <a href="./drinks.html"><span class="label-main">← Back to Drinks</span></a>
  </nav>
  <main>
    <section class="section active" aria-labelledby="beers-title">
      <h3 id="beers-title" class="hero-title" style="text-align:center; margin:0 0 1rem;">
        Beers / Stouts
      </h3>
      <div class="price-panel">
        <img src="images/beers-stouts.jpg" alt="Beers, stouts and Smirnoff Ice" />
        <ul class="price-list">
          <li id="card-big-heineken"><span class="name">Big Heineken</span><span class="dots"></span><span class="price" id="price-big-heineken">—</span></li>
          <li id="card-big-stout"><span class="name">Big Stout</span><span class="dots"></span><span class="price" id="price-big-stout">—</span></li>
          <li id="card-small-stout"><span class="name">Small Stout</span><span class="dots"></span><span class="price" id="price-small-stout">—</span></li>
          <li id="card-big-smirnoff-ice"><span class="name">Big Smirnoff Ice</span><span class="dots"></span><span class="price" id="price-big-smirnoff-ice">—</span></li>
          <li id="card-smirnoff-ice-double-black"><span class="name">Smirnoff Double Black</span><span class="dots"></span><span class="price" id="price-smirnoff-ice-double-black">—</span></li>
          <li id="card-smirnoff-ice-small"><span class="name">Smirnoff Ice (Small)</span><span class="dots"></span><span class="price" id="price-smirnoff-ice-small">—</span></li>
          <li id="card-star-radler"><span class="name">Star Radler</span><span class="dots"></span><span class="price" id="price-star-radler">—</span></li>
          <li id="card-desperados"><span class="name">Desperados</span><span class="dots"></span><span class="price" id="price-desperados">—</span></li>
          <li id="card-flying-fish"><span class="name">Flying Fish</span><span class="dots"></span><span class="price" id="price-flying-fish">—</span></li>
          <li id="card-legend-twist"><span class="name">Legend Twist</span><span class="dots"></span><span class="price" id="price-legend-twist">—</span></li>
        </ul>
      </div>
    </section>
    <div class="tray-note">Takeout ₦500</div>
  </main>
  <nav class="bottom-nav" aria-label="Primary">
    <a href="./index.html">Home</a>
    <a href="./food.html">Food</a>
    <a href="./drinks.html" class="active">Drinks</a>
    <a href="./contact.html">Contact</a>
  </nav>
  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzglCNUwMTg89aylX0vfv5_w9N1x2Ay1JKtNCq2AiP64vJ8ZuJjzaL9oHipM_-yJmxsww/exec';
    const TOKEN = 'Forgive1988@';
    function formatNaira(amount) {
      if(!amount || isNaN(amount)) return '₦0';
      return '₦' + Number(amount).toLocaleString();
    }
    // --- FINAL: No trailing dash, supports all names ---
    function getIdFromName(name) {
      return ('price-' + name
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/gi,'-')
        .replace(/-+/g,'-')
        .toLowerCase()).replace(/-$/, '');
    }
    function getCardIdFromName(name) {
      return ('card-' + name
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/gi,'-')
        .replace(/-+/g,'-')
        .toLowerCase()).replace(/-$/, '');
    }
    window.getIdFromName = getIdFromName;


    function injectPrices() {
      fetch(`${ENDPOINT}?token=${TOKEN}`)
        .then(res => res.json())
        .then(result => {
          if(result.ok) {
            result.rows.forEach(item => {
              if(
                item.type==="Drinks" &&
                item.cat &&
                item.cat.toLowerCase().includes("beer") &&
                item.name
              ) {
                let priceId = getIdFromName(item.name);
                let cardId = getCardIdFromName(item.name);
                let priceElem = document.getElementById(priceId);
                let cardElem = document.getElementById(cardId);
                if(priceElem && cardElem) {
                  priceElem.innerHTML = '';
                  cardElem.classList.remove('soldout');
                  if(item.available === true) {
                    priceElem.textContent = formatNaira(item.price);
                  } else {
                    priceElem.innerHTML = `${formatNaira(item.price)} <span class="soldout-label">Sold Out</span>`;
                    cardElem.classList.add('soldout');
                  }
                }
              }
            });
          }
        });
    }
    document.addEventListener('DOMContentLoaded', injectPrices);
  </script>
</body>
</html>
